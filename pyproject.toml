# Tooling configuration only; the Django project lives in api/ and the CLI in cli/ (which has its own pyproject.toml).
[tool.ruff]
target-version = "py312"
line-length = 160
extend-exclude = ["**/migrations/*.py", "web", "node_modules"]

[tool.ruff.lint]
# Errors, undefined names and likely bugs. Style is left to the formatter and review.
select = ["E9", "F", "B"]
ignore = ["B904", "B008"]
